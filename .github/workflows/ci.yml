name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-headless:
    name: clippy (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `image` is a non-optional dep with `avif-native` enabled, which
      # pulls dav1d-sys. dav1d is an image codec, not a UI lib, so even
      # the "headless" workspace build needs libdav1d-dev.
      - name: install libdav1d-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdav1d-dev pkg-config bubblewrap util-linux
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  clippy-gui:
    name: clippy (gui + ai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install GTK4/libadwaita/dav1d dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libdav1d-dev pkg-config bubblewrap util-linux
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  test:
    name: test (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install libdav1d-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdav1d-dev pkg-config bubblewrap util-linux
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Sandbox tests exercise the distro bubblewrap policy and fail closed.
      # Do not disable AppArmor or add broad container capabilities to pass.
      - run: cargo test --workspace --all-targets --locked

  test-gui:
    name: test (gui + ai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install GTK4/libadwaita/dav1d dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libdav1d-dev pkg-config bubblewrap util-linux xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Tests in `crates/bigiris/src/gui.rs` (the 20 anchor/zoom tests)
      # only compile with `--features gui`, so they need their own job.
      # Sandbox tests exercise the distro bubblewrap policy and fail closed.
      # Do not disable AppArmor or add broad container capabilities to pass.
      - run: cargo test --workspace --all-features --all-targets --locked

      - name: viewer lifecycle (synthetic images, isolated display)
        env:
          GSETTINGS_BACKEND: memory
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          xvfb-run -a dbus-run-session -- cargo test -p bigiris --features "gui ai" \
            --locked viewer_lifecycle_releases_state_and_workers -- \
            --ignored --test-threads=1

  build:
    name: build (release, gui + ai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install GTK4/libadwaita/dav1d dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libdav1d-dev pkg-config bubblewrap util-linux
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `ai` usa load-dynamic do ort: compila sem libonnxruntime presente,
      # so precisaria do .so em runtime (e self-test nao carrega o backend).
      - run: cargo build --release --locked --features "gui ai" -p bigiris
      - run: ./target/release/bigiris --self-test

  appstream:
    name: AppStream metainfo validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install appstreamcli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream
      # --no-net evita lookup das URLs (homepage, bugtracker) que sao
      # warnings esperados antes do repo virar publico. Trocar por
      # `appstreamcli validate` (sem --no-net) quando o repo for publico.
      - run: appstreamcli validate --no-net data/com.biglinux.Iris.metainfo.xml

  desktop:
    name: .desktop validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install desktop-file-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
      - run: desktop-file-validate data/com.biglinux.Iris.desktop

  makepkg:
    name: makepkg (Arch container, PKGBUILD.local)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: install Arch deps
        run: |
          pacman -Syu --noconfirm --needed base-devel rust git sudo
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
      - uses: actions/checkout@v4
      - name: chown for builder
        run: chown -R builder:builder .
      # Usa PKGBUILD.local (build do checkout local, sem clone remoto).
      # O PKGBUILD principal usa `source=git+https://github.com/xathay/bigiris`,
      # que makepkg nao consegue clonar em repo privado sem credenciais.
      # Docker blocks nested namespaces by default. Run functional sandbox
      # tests in the host test/build jobs; this job checks build + packaging.
      - name: makepkg
        working-directory: pkgbuild
        run: |
          sudo -u builder PKGEXT=.pkg.tar makepkg \
            -p PKGBUILD.local \
            --noconfirm \
            --syncdeps \
            --skipchecksums \
            --skipinteg \
            --nocheck \
            --clean

  nautilus:
    name: Nautilus extension contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - run: glib-compile-schemas --strict --dry-run data

  security:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny unsound

  stability:
    name: Synthetic core stress and stability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install codec dev files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdav1d-dev pkg-config bubblewrap util-linux
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p bigimage-core --example quality_probe
      - run: ./target/release/examples/quality_probe stress 32
      - run: ./target/release/examples/quality_probe soak 30

  memcheck:
    name: Core memory errors and leaks (Valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install codec and debugger files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdav1d-dev pkg-config bubblewrap util-linux valgrind libc6-dbg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p bigimage-core --example quality_probe
      - name: instrument synthetic decode/resize/preview/encode cycles
        run: |
          valgrind --leak-check=full --show-leak-kinds=definite,indirect \
            --errors-for-leak-kinds=definite,indirect --error-exitcode=1 \
            ./target/release/examples/quality_probe soak 1 320x240

  fuzz:
    name: Codec and ICC fuzzing (ASan + LSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdav1d-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/fuzz.py --seconds 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-evidence
          path: |
            target/quality/fuzz
            target/quality/fuzz-artifacts
